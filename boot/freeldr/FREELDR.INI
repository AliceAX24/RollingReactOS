; FreeLoader Configuration - Open RollingCake SYS Edits
; Optimized for ReactOS 0.4.16 with NODEBUG support

[FREELOADER]
DefaultOS=ReactOS_NoDebug
TimeOut=5
; Remove MessageBox for faster boot in production
; MessageBox=Welcome to FreeLoader!

[Display]
DisplayMode=NORMAL_VGA
TitleText=ReactOS Boot Manager
StatusBarColor=Cyan
StatusBarTextColor=Black
BackdropTextColor=White
BackdropColor=Blue
BackdropFillStyle=Medium
TitleBoxTextColor=White
TitleBoxColor=Red
MessageBoxTextColor=White
MessageBoxColor=Blue
MenuTextColor=White
MenuColor=Blue
TextColor=Yellow
SelectedTextColor=Black
SelectedColor=Gray
ShowTime=No
MenuBox=Yes
CenterMenu=Yes
MinimalUI=No
SpecialEffects=No

[Operating Systems]
ReactOS_NoDebug="ReactOS (Fast / No Debug)"
ReactOS_Debug_Serial="ReactOS (Debug Serial COM1)"
ReactOS_Debug_Screen="ReactOS (Debug Screen)"
ReactOSFloppy="ReactOS (Floppy Emergency)"

; --- PRODUCTION MODE (FASTEST) ---
[ReactOS_NoDebug]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\reactos
; NODEBUG disables KDCOM initialization entirely via our kdmain.c patch
; FASTDETECT skips legacy hardware detection
; NOGUIBOOT disables the splash screen for verbose text output
Options=/NODEBUG /FASTDETECT /NOGUIBOOT
Kernel=SYSTEM32\NTOSKRNL.EXE
Hal=SYSTEM32\HAL.DLL

; --- SERIAL DEBUG MODE ---
[ReactOS_Debug_Serial]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\reactos
; Explicitly enable serial debug on COM1 at 115200 baud
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS
Kernel=SYSTEM32\NTOSKRNL.EXE
Hal=SYSTEM32\HAL.DLL

; --- SCREEN DEBUG MODE ---
[ReactOS_Debug_Screen]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\reactos
; Debug output directly to VGA screen
Options=/DEBUGPORT=SCREEN /SOS
Kernel=SYSTEM32\NTOSKRNL.EXE
Hal=SYSTEM32\HAL.DLL

; --- EMERGENCY FLOPPY ---
[ReactOSFloppy]
BootType=Windows2003
SystemPath=multi(0)disk(0)fdisk(0)
Options=/DEBUGPORT=SCREEN /SOS
Kernel=NTOSKRNL.EXE
Hal=HAL.DLL